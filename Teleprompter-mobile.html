<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Teleprompter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a1a;
      color: #f0f0f0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── SETUP SCREEN ── */
    #setup {
      display: flex;
      min-height: 100vh;
    }

    /* ── LEFT PANEL ── */
    #left-panel {
      display: flex;
      flex-direction: column;
      width: 400px;
      min-width: 320px;
      padding: 28px 24px;
      gap: 16px;
      border-right: 1px solid #2e2e2e;
      background: #141414;
      overflow-y: auto;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    h1 span { color: #4f9eff; }

    #script-input {
      flex: 1 1 0;
      min-height: 140px;
      max-height: 45vh;
      background: #1f1f1f;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 14px;
      font-size: 14px;
      color: #e0e0e0;
      resize: vertical;
      outline: none;
      line-height: 1.8;
      font-family: inherit;
      transition: border-color 0.2s;
      overflow-y: auto;
    }

    #script-input:focus { border-color: #4f9eff; }
    #script-input::placeholder { color: #555; }

    .ctrl {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .ctrl-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ctrl-row label { font-size: 13px; color: #888; }
    .ctrl-row span  { font-size: 13px; color: #4f9eff; font-weight: 600; }

    .ctrl input[type=range] {
      width: 100%;
      accent-color: #4f9eff;
      cursor: pointer;
      height: 20px;
    }

    /* Line count */
    #lc-selector { display: flex; gap: 8px; }

    .lc-btn {
      flex: 1;
      padding: 9px 0;
      background: #1f1f1f;
      border: 1px solid #333;
      border-radius: 8px;
      color: #666;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .lc-btn.active {
      background: #1a3a5c;
      border-color: #4f9eff;
      color: #4f9eff;
    }

    /* Inline preview */
    #inline-preview {
      background: #0a0a0a;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 20px 16px;
      flex-shrink: 0;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0;
      overflow: hidden;
    }

    #preview-label-inline {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #333;
      margin-bottom: 12px;
    }

    .ipl {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: rgba(255,255,255,0.28);
      line-height: 1.4;
    }

    .ipl + .ipl { margin-top: 0.5em; }

    .ipl.ipl-current {
      color: #fff;
      text-shadow: 0 0 20px rgba(79,158,255,0.6);
    }

    #start-btn {
      background: #4f9eff;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      flex-shrink: 0;
    }

    #start-btn:active { transform: scale(0.98); background: #3a8aed; }

    .hint {
      font-size: 11px;
      color: #444;
      line-height: 1.7;
      text-align: center;
      flex-shrink: 0;
    }

    .hint strong { color: #666; }

    /* ── RIGHT PANEL (desktop preview) ── */
    #preview-panel {
      flex: 1;
      background: #0d0d0d;
      position: relative;
      overflow: hidden;
    }

    #preview-label {
      position: absolute;
      top: 14px;
      left: 20px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #333;
      user-select: none;
    }

    #width-guide {
      position: absolute;
      top: 0; bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      border-left: 1px dashed #222;
      border-right: 1px dashed #222;
      pointer-events: none;
    }

    #preview-block {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      cursor: grab;
      user-select: none;
    }

    #preview-block:active { cursor: grabbing; }

    .dpl {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: rgba(255,255,255,0.28);
      line-height: 1.4;
    }

    .dpl + .dpl { margin-top: 0.55em; }
    .dpl.dpl-current {
      color: #fff;
      text-shadow: 0 0 24px rgba(79,158,255,0.65);
    }

    #drag-hint {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: #2a2a2a;
      user-select: none;
      white-space: nowrap;
    }

    /* ── PRESENTATION SCREEN ── */
    #presentation {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
    }

    #tap-advance {
      position: absolute;
      inset: 0;
      z-index: 1;
      cursor: pointer;
    }

    #script-block {
      position: absolute;
      user-select: none;
      z-index: 2;
      pointer-events: none;
    }

    .pline {
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      color: rgba(255,255,255,0.28);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .pline + .pline { margin-top: 0.55em; }

    .pline.pline-current {
      color: #fff;
      text-shadow: 0 0 28px rgba(79,158,255,0.65);
    }

    .pline.hidden { display: none; }
    .pline.fade-out { opacity: 0; transform: translateY(-14px); }
    .pline.slide-in { animation: slideIn 0.2s ease forwards; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* HUD — bottom */
    #hud {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      padding: 10px 16px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      border-top: 1px solid #1a1a1a;
      z-index: 100;
      gap: 10px;
    }

    #progress-text {
      font-size: 12px;
      color: #444;
      flex: 1;
      white-space: nowrap;
    }

    .hud-btn {
      background: transparent;
      border: 1px solid #2a2a2a;
      color: #555;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .hud-btn:active { background: #1a1a1a; color: #fff; border-color: #555; }

    #progress-bar-wrap {
      position: fixed;
      bottom: calc(44px + env(safe-area-inset-bottom));
      left: 0; right: 0;
      height: 2px;
      background: #111;
      z-index: 100;
    }

    #progress-bar {
      height: 100%;
      background: #4f9eff;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* ── MOBILE STYLES ── */
    @media (max-width: 700px) {
      body { overflow-y: auto; }

      #setup {
        flex-direction: column;
        min-height: 100vh;
        padding-bottom: 24px;
      }

      #left-panel {
        width: 100%;
        min-width: unset;
        border-right: none;
        max-height: unset;
        padding: 20px 16px;
        gap: 14px;
      }

      #script-input {
        min-height: 160px;
        max-height: 35vh;
        font-size: 16px; /* prevent zoom on iOS */
      }

      #preview-panel { display: none; }

      #inline-preview { display: flex; }

      h1 { font-size: 18px; }

      #start-btn {
        padding: 16px;
        font-size: 17px;
      }

      /* Larger touch targets */
      .ctrl input[type=range] { height: 28px; }
      .lc-btn { padding: 12px 0; font-size: 16px; }

      /* Presentation HUD larger for mobile */
      .hud-btn { padding: 10px 20px; font-size: 14px; }
    }

    /* Desktop: hide inline preview */
    @media (min-width: 701px) {
      #inline-preview { display: none; }
      #preview-panel  { display: block; }
    }
  </style>
</head>
<body>

  <!-- SETUP -->
  <div id="setup">
    <div id="left-panel">
      <h1>Teleprompter <span>·</span></h1>

      <textarea id="script-input" placeholder="Paste your script here.
Long paragraphs are auto-split to fit the display width."></textarea>

      <div class="ctrl">
        <div class="ctrl-row">
          <label>Font size</label>
          <span id="font-size-display">48px</span>
        </div>
        <input type="range" id="font-size-slider" min="20" max="120" value="48" />
      </div>

      <div class="ctrl">
        <div class="ctrl-row">
          <label>Display width</label>
          <span id="display-width-display">80%</span>
        </div>
        <input type="range" id="display-width-slider" min="30" max="98" value="80" />
      </div>

      <div class="ctrl">
        <div class="ctrl-row"><label>Lines to show</label></div>
        <div id="lc-selector">
          <button class="lc-btn" data-count="2">2</button>
          <button class="lc-btn active" data-count="3">3</button>
          <button class="lc-btn" data-count="4">4</button>
        </div>
      </div>

      <!-- Inline preview (mobile only) -->
      <div id="inline-preview">
        <div id="preview-label-inline">Preview</div>
      </div>

      <button id="start-btn">▶ Start</button>

      <p class="hint">
        <strong>Tap screen</strong> — next &nbsp;·&nbsp;
        <strong>◀ Back</strong> — previous &nbsp;·&nbsp;
        <strong>Esc</strong> — exit
      </p>
    </div>

    <!-- Right panel (desktop only) -->
    <div id="preview-panel">
      <div id="preview-label">Preview — drag to set position</div>
      <div id="width-guide"></div>
      <div id="preview-block"></div>
      <div id="drag-hint">Drag to position</div>
    </div>
  </div>

  <!-- PRESENTATION -->
  <div id="presentation">
    <div id="tap-advance"></div>

    <div id="hud">
      <span id="progress-text">1 / 1</span>
      <button class="hud-btn" id="back-btn">◀ Back</button>
      <button class="hud-btn" id="exit-btn">✕ Exit</button>
    </div>

    <div id="script-block">
      <div class="pline" id="pline-0"></div>
      <div class="pline" id="pline-1"></div>
      <div class="pline" id="pline-2"></div>
      <div class="pline" id="pline-3"></div>
    </div>

    <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
  </div>

  <script>
    const setupEl      = document.getElementById('setup');
    const presentEl    = document.getElementById('presentation');
    const scriptInput  = document.getElementById('script-input');
    const fontSlider   = document.getElementById('font-size-slider');
    const fontDisplay  = document.getElementById('font-size-display');
    const widthSlider  = document.getElementById('display-width-slider');
    const widthDisplay = document.getElementById('display-width-display');
    const widthGuide   = document.getElementById('width-guide');
    const startBtn     = document.getElementById('start-btn');
    const exitBtn      = document.getElementById('exit-btn');
    const backBtn      = document.getElementById('back-btn');
    const tapAdvance   = document.getElementById('tap-advance');
    const progressText = document.getElementById('progress-text');
    const progressBar  = document.getElementById('progress-bar');
    const scriptBlock  = document.getElementById('script-block');
    const previewBlock = document.getElementById('preview-block');
    const previewPanel = document.getElementById('preview-panel');
    const inlinePrev   = document.getElementById('inline-preview');
    const plineEls     = [0,1,2,3].map(i => document.getElementById('pline-' + i));

    let lines        = [];
    let currentIndex = 0;
    let fontSize     = 48;
    let widthPct     = 80;
    let lineCount    = 3;
    let animating    = false;
    let posXFrac     = null;
    let posYFrac     = null;

    const mCtx = document.createElement('canvas').getContext('2d');

    function fontStr(size) {
      return `500 ${size || fontSize}px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif`;
    }

    function measureW(text, size) {
      mCtx.font = fontStr(size);
      return mCtx.measureText(text).width;
    }

    function splitParagraph(para, maxPx) {
      if (!para.trim()) return [];
      const result = [];
      const tokens = para.split(' ');
      let cur = '';
      for (const tok of tokens) {
        const test = cur ? cur + ' ' + tok : tok;
        if (measureW(test) <= maxPx) {
          cur = test;
        } else {
          if (cur) result.push(cur);
          if (measureW(tok) > maxPx) {
            let cl = '';
            for (const ch of tok) {
              if (measureW(cl + ch) <= maxPx) { cl += ch; }
              else { if (cl) result.push(cl); cl = ch; }
            }
            cur = cl;
          } else {
            cur = tok;
          }
        }
      }
      if (cur.trim()) result.push(cur.trim());
      return result;
    }

    function buildLines(raw, maxPx) {
      const all = [];
      for (const para of raw.split('\n'))
        all.push(...splitParagraph(para.trim(), maxPx));
      return all.filter(l => l.length > 0);
    }

    // Always use window.innerWidth for accurate line splitting
    function maxPx() { return window.innerWidth * widthPct / 100; }

    // ── Sliders ──
    fontSlider.addEventListener('input', () => {
      fontSize = parseInt(fontSlider.value);
      fontDisplay.textContent = fontSize + 'px';
      updatePreview();
    });

    widthSlider.addEventListener('input', () => {
      widthPct = parseInt(widthSlider.value);
      widthDisplay.textContent = widthPct + '%';
      updateWidthGuide();
      updatePreview();
    });

    document.getElementById('lc-selector').addEventListener('click', e => {
      const btn = e.target.closest('.lc-btn');
      if (!btn) return;
      document.querySelectorAll('.lc-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      lineCount = parseInt(btn.dataset.count);
      updatePreview();
    });

    function updateWidthGuide() {
      const panelRect = previewPanel.getBoundingClientRect();
      widthGuide.style.width = (panelRect.width * widthPct / 100) + 'px';
    }

    function updatePreview() {
      const raw = scriptInput.value.trim();
      const mp  = maxPx();
      const previewLines = raw ? buildLines(raw, mp) : ['Your line will appear here'];

      // ── Desktop preview panel ──
      previewBlock.innerHTML = '';
      previewBlock.style.width = mp + 'px';
      for (let i = 0; i < lineCount; i++) {
        const d = document.createElement('div');
        d.className = 'dpl' + (i === 0 ? ' dpl-current' : '');
        d.style.fontSize = fontSize + 'px';
        d.textContent = previewLines[i] || '';
        if (i > 0) d.style.marginTop = '0.55em';
        previewBlock.appendChild(d);
      }

      // ── Mobile inline preview ──
      // Keep the label, replace line divs
      const label = document.getElementById('preview-label-inline');
      inlinePrev.innerHTML = '';
      inlinePrev.appendChild(label);

      // Scale font down to fit preview box (preview box is ~full width minus padding)
      const previewBoxW = inlinePrev.clientWidth - 32 || window.innerWidth - 64;
      const scale = Math.min(1, previewBoxW / mp);
      const previewFontSize = Math.max(12, Math.round(fontSize * scale));

      for (let i = 0; i < lineCount; i++) {
        const d = document.createElement('div');
        d.className = 'ipl' + (i === 0 ? ' ipl-current' : '');
        d.style.fontSize = previewFontSize + 'px';
        d.textContent = previewLines[i] || '';
        if (i > 0) d.style.marginTop = '0.5em';
        inlinePrev.appendChild(d);
      }
    }

    scriptInput.addEventListener('input', updatePreview);

    // Init
    updateWidthGuide();
    updatePreview();

    // ── Desktop drag (preview block) ──
    (function () {
      let drag = false, sx, sy, ox, oy;
      previewBlock.addEventListener('mousedown', e => {
        drag = true; sx = e.clientX; sy = e.clientY;
        const r = previewBlock.getBoundingClientRect();
        const pr = previewPanel.getBoundingClientRect();
        ox = r.left - pr.left; oy = r.top - pr.top;
        previewBlock.style.transform = 'none';
        previewBlock.style.left = ox + 'px';
        previewBlock.style.top  = oy + 'px';
        e.preventDefault();
      });
      document.addEventListener('mousemove', e => {
        if (!drag) return;
        const pr = previewPanel.getBoundingClientRect();
        const nl = Math.max(0, Math.min(pr.width  - previewBlock.offsetWidth,  ox + e.clientX - sx));
        const nt = Math.max(0, Math.min(pr.height - previewBlock.offsetHeight, oy + e.clientY - sy));
        previewBlock.style.left = nl + 'px';
        previewBlock.style.top  = nt + 'px';
      });
      document.addEventListener('mouseup', () => {
        if (!drag) return; drag = false;
        const pr = previewPanel.getBoundingClientRect();
        const r  = previewBlock.getBoundingClientRect();
        posXFrac = (r.left - pr.left) / pr.width;
        posYFrac = (r.top  - pr.top)  / pr.height;
      });
    })();

    // ── Presentation drag (script block) — mouse + touch ──
    (function () {
      let drag = false, sx, sy, ox, oy;

      function startDrag(cx, cy) {
        drag = true; sx = cx; sy = cy;
        ox = parseFloat(scriptBlock.style.left) || 0;
        oy = parseFloat(scriptBlock.style.top)  || 0;
      }

      function moveDrag(cx, cy) {
        if (!drag) return;
        const nl = Math.max(0, Math.min(window.innerWidth  - scriptBlock.offsetWidth,  ox + cx - sx));
        const nt = Math.max(0, Math.min(window.innerHeight - scriptBlock.offsetHeight, oy + cy - sy));
        scriptBlock.style.left = nl + 'px';
        scriptBlock.style.top  = nt + 'px';
      }

      scriptBlock.addEventListener('mousedown',  e => { startDrag(e.clientX, e.clientY); e.stopPropagation(); e.preventDefault(); });
      scriptBlock.addEventListener('touchstart', e => { startDrag(e.touches[0].clientX, e.touches[0].clientY); e.stopPropagation(); }, { passive: true });

      document.addEventListener('mousemove',  e => moveDrag(e.clientX, e.clientY));
      document.addEventListener('touchmove',  e => moveDrag(e.touches[0].clientX, e.touches[0].clientY), { passive: true });

      function end() { drag = false; }
      document.addEventListener('mouseup',  end);
      document.addEventListener('touchend', end);
    })();

    // ── Start ──
    startBtn.addEventListener('click', () => {
      const raw = scriptInput.value.trim();
      if (!raw) return;
      const mp = maxPx();
      lines = buildLines(raw, mp);
      if (!lines.length) return;

      currentIndex = 0;

      let sl, st;
      if (posXFrac !== null) {
        sl = posXFrac * window.innerWidth;
        st = posYFrac * window.innerHeight;
      } else {
        sl = window.innerWidth  * (1 - widthPct / 100) / 2;
        st = window.innerHeight / 2 - fontSize * lineCount;
      }

      scriptBlock.style.left  = sl + 'px';
      scriptBlock.style.top   = st + 'px';
      scriptBlock.style.width = mp + 'px';

      plineEls.forEach((el, i) => {
        el.style.fontSize = fontSize + 'px';
        el.classList.toggle('hidden', i >= lineCount);
      });

      setupEl.style.display   = 'none';
      presentEl.style.display = 'block';
      renderLines();
    });

    function renderLines() {
      plineEls.forEach((el, i) => {
        if (i >= lineCount) return;
        el.textContent = lines[currentIndex + i] || '';
        el.classList.toggle('pline-current', i === 0);
      });
      progressText.textContent = `${currentIndex + 1} / ${lines.length}`;
      progressBar.style.width  = ((currentIndex + 1) / lines.length * 100) + '%';
    }

    function advance() {
      if (animating || currentIndex >= lines.length - 1) return;
      animating = true;
      plineEls.slice(0, lineCount).forEach(el => el.classList.add('fade-out'));
      setTimeout(() => {
        plineEls.slice(0, lineCount).forEach(el => el.classList.remove('fade-out'));
        currentIndex++;
        renderLines();
        plineEls.slice(0, lineCount).forEach(el => el.classList.add('slide-in'));
        setTimeout(() => {
          plineEls.slice(0, lineCount).forEach(el => el.classList.remove('slide-in'));
          animating = false;
        }, 200);
      }, 200);
    }

    function goBack() {
      if (animating || currentIndex === 0) return;
      currentIndex--;
      renderLines();
    }

    function exitPresentation() {
      presentEl.style.display = 'none';
      setupEl.style.display   = 'flex';
    }

    tapAdvance.addEventListener('click',    advance);
    tapAdvance.addEventListener('touchend', e => { e.preventDefault(); advance(); });
    backBtn.addEventListener('click',  e => { e.stopPropagation(); goBack(); });
    exitBtn.addEventListener('click',  e => { e.stopPropagation(); exitPresentation(); });

    document.addEventListener('keydown', e => {
      if (presentEl.style.display === 'none') return;
      if (e.code === 'Space')     { e.preventDefault(); advance(); }
      if (e.code === 'ArrowLeft') { e.preventDefault(); goBack(); }
      if (e.code === 'Escape')    { exitPresentation(); }
    });

    window.addEventListener('resize', () => { updateWidthGuide(); updatePreview(); });
  </script>
</body>
</html>
